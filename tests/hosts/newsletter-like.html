<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter-like host</title>
<script async src="https://nestpass.ai/kit/nest-nav.js"></script>
<style>
/* The newsletter's --nest-* knobs and its teal body text. */
:root { --nest-accent: #f00; --nest-overlay: #f00; --nest-fallback-bg: #f00; --nest-title-y: 99px; }
html, body { margin: 0; padding: 0; background: #f4f4f4; font-family: 'Montserrat', system-ui, sans-serif; color: #0D6F82; }
.below { position: relative; z-index: 5; height: 400px; background: #eee; }
</style>
</head>
<body>
<nest-nav tool="flyers"><a slot="fallback" class="brand" href="#">Flyers</a><nav class="own" aria-label="Tool"><a href="#library">Library</a> <a class="btn" href="#new">New</a></nav></nest-nav>
<main><p class="text">Page content.</p><div class="below">Positioned content under the bar.</div></main>
</body>
</html>
